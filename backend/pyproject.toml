[project]
name = "pbm-backend"
version = "0.1.0"
description = "Backend de Pokémon Bot Manager: API local, persistencia SQLite, simulador determinista y adaptador mGBA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "emulator: pruebas reales con mGBA + ROM (se omiten si no están disponibles)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
